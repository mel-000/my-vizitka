server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Основное правило раздачи статики
    location / {
        try_files $uri $uri/ =404;
    }

    # Кэширование картинок и стилей
    location ~* \.(css|js|png|jpg|jpeg|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}